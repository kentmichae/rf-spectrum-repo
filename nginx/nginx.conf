events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    sendfile on;
    keepalive_timeout 65;

    # Dynamic CORS origin
    map $http_origin $cors_origin {
        default 0;
        ~*^(http://(localhost|127\.0\.0\.1):(3000|3001))$ $1;
    }

    server {
        listen 80;
        server_name localhost;

        # Gzip compression
        gzip on;
        gzip_types text/plain application/json application/javascript text/css;

        # Static file caching
        location /static {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Frontend assets - no cache to bust bundles
        location /assets {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Frontend HTML - no cache
        location = / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Set-Cookie;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Frontend SPA proxy (Vite dev server / serve)
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Set-Cookie;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # API proxy to backend
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS headers — $cors_origin is set by the http-level map directive
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";

            # Handle preflight
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health endpoint for proxy itself
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
